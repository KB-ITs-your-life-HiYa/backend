# PR 이 develop 에 들어가기 전에 컴파일과 테스트가 통과하는지 확인한다.
#
# 이 워크플로우에는 application-secret.properties 가 없다. 일부러 그렇다.
# 각자 로컬에만 있는 API 키에 기대는 코드가 있으면 여기서 걸린다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# 같은 PR 에 연속으로 push 하면 앞선 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 테스트가 실제 DB 에 붙는다(@SpringBootTest).
    # docker-compose.yml 과 같은 값이라 application-local.properties 를 그대로 쓴다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fledge
          POSTGRES_USER: fledge
          POSTGRES_PASSWORD: fledge_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fledge -d fledge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      # 스키마와 시드는 Flyway 가 기동 시 적용한다. 따로 준비할 것이 없다.
      - name: 빌드 + 테스트
        run: ./gradlew build

      # 실패했을 때 어느 테스트가 깨졌는지 보려면 리포트가 필요하다.
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
