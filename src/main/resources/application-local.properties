# 로컬 개발용. 전부 더미값이라 커밋한다.
# 먼저 `docker compose up -d` 로 Postgres 를 띄워야 기동된다.

spring.datasource.url=jdbc:postgresql://localhost:5432/fledge
spring.datasource.username=fledge
spring.datasource.password=fledge_local

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# 로컬에만 테스트 데이터를 넣는다. supabase 프로필에는 적용되지 않는다.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# 늦게 도착한 마이그레이션도 적용한다.
# 여러 명이 각자 브랜치에서 마이그레이션을 만들면 머지 순서에 따라 버전이 뒤집힌다.
# (V..1827 을 이미 적용했는데 나중에 V..1508 이 들어오는 식)
# 기본값 false 면 그때 기동이 실패한다 -> Detected resolved migration not applied
# 로컬에만 적용한다. 운영에서는 순서가 지켜지는 것이 맞다.
spring.flyway.out-of-order=true
