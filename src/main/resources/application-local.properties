# 로컬 개발용 설정. 전부 더미값이라 커밋한다.
# 먼저 `docker compose up -d` 로 Postgres 를 띄워야 기동된다.

spring.datasource.url=jdbc:postgresql://localhost:5432/fledge
spring.datasource.username=fledge
spring.datasource.password=fledge_local

# 스키마는 아직 없다. 테이블 설계가 확정되면 Flyway 로 옮긴다.
# (ddl-auto=none 이라 JPA 가 테이블을 멋대로 만들지 않는다)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
