# 로컬 개발용. 전부 더미값이라 커밋한다.
# 먼저 `docker compose up -d` 로 Postgres 를 띄워야 기동된다.

spring.datasource.url=jdbc:postgresql://localhost:5432/fledge
spring.datasource.username=fledge
spring.datasource.password=fledge_local

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug

# 로컬에만 테스트 데이터를 넣는다. supabase 프로필에는 적용되지 않는다.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
