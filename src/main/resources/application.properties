spring.application.name=fledge-backend

# 프로필을 안 주면 로컬로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
spring.profiles.active=local

# 실제 비밀값(Supabase URL/키, Gemini 키 등)은 여기 두지 않는다.
# application-secret.properties 에 넣고, 이 파일은 커밋하지 않는다. (없어도 기동된다)
spring.config.import=optional:classpath:application-secret.properties

# Java 21 가상 스레드. Gemini/외부 API 응답 대기가 톰캣 스레드를 잡아먹지 않게 한다.
spring.threads.virtual.enabled=true

# JPA (프로필 공통)
#   스키마는 Flyway 가 관리한다. JPA 가 테이블을 임의로 만들지 않도록 none 고정.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 헬스체크만 열어둔다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# API 문서 (springdoc-openapi)
#   Swagger UI  : http://localhost:8080/swagger-ui.html
#   OpenAPI JSON: http://localhost:8080/v3/api-docs
#   운영 배포 시에는 prod 프로필에서 springdoc.api-docs.enabled=false 로 끈다.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# DB 스키마 마이그레이션 (Flyway)
#   앱이 기동될 때 db/migration 의 SQL 을 순서대로 적용한다.
#   작성 규칙은 src/main/resources/db/migration/README.md 참고.
spring.flyway.locations=classpath:db/migration

# CORS — 브라우저에서 API 를 호출할 수 있는 출처
#   프론트를 웹(expo start 후 w)으로 띄울 때만 필요하다.
#   실기기(Expo Go)는 네이티브 fetch 라 CORS 와 무관하다.
#   운영 배포 시에는 prod 프로필에서 실제 도메인으로 덮어쓴다.
cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*]
