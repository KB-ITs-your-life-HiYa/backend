spring.application.name=fledge-backend

# 프로필을 안 주면 로컬로 뜬다. 운영은 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
spring.profiles.active=local

# 실제 비밀값(Supabase URL/키, Gemini 키 등)은 여기 두지 않는다.
# application-secret.properties 에 넣고, 이 파일은 커밋하지 않는다. (없어도 기동된다)
spring.config.import=optional:classpath:application-secret.properties

# Java 21 가상 스레드. Gemini/외부 API 응답 대기가 톰캣 스레드를 잡아먹지 않게 한다.
spring.threads.virtual.enabled=true

# 헬스체크만 열어둔다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
