# 테스트 전용 DB. application-local.properties 와 같은 Postgres 컨테이너를 쓰지만
# 데이터베이스 이름만 다르다(fledge_test). 개발 중인 fledge DB 와 완전히 분리된다.
#
# 로컬에 한 번만 만들면 된다.
#   docker exec fledge-postgres psql -U fledge -d postgres -c "CREATE DATABASE fledge_test OWNER fledge;"

spring.datasource.url=jdbc:postgresql://localhost:5432/fledge_test
spring.datasource.username=fledge
spring.datasource.password=fledge_local

spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.flyway.out-of-order=true
